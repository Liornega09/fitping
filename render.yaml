services:
  - type: web
    name: fitping
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitping-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: INTERNAL_JOBS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: cron
    name: fitping-weekly-summary
    runtime: node
    region: frankfurt
    plan: free
    schedule: "0 8 * * 1"
    buildCommand: npm install
    startCommand: >
      curl -s -X POST
      -H "Authorization: Bearer $INTERNAL_JOBS_TOKEN"
      https://fitping.onrender.com/internal/jobs/weekly-summary
    envVars:
      - key: INTERNAL_JOBS_TOKEN
        sync: false

  - type: cron
    name: fitping-nudge
    runtime: node
    region: frankfurt
    plan: free
    schedule: "0 9 * * *"
    buildCommand: npm install
    startCommand: >
      curl -s -X POST
      -H "Authorization: Bearer $INTERNAL_JOBS_TOKEN"
      https://fitping.onrender.com/internal/jobs/nudge
    envVars:
      - key: INTERNAL_JOBS_TOKEN
        sync: false

databases:
  - name: fitping-db
    region: frankfurt
    plan: free
    databaseName: fitping
